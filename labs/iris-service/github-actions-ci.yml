# העתק קובץ זה אל .github/workflows/ci.yml כדי להפעיל אותו ב-GitHub.
name: ml-service-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: labs/iris-service

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Train a model
        run: python train.py

      - name: Run tests
        run: python -m pytest -q

      - name: Check the quality gate
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path

          metrics = json.loads(Path("artifacts/metrics.json").read_text())
          gap = metrics["selected_cv_macro_f1"] - metrics["baseline_cv_macro_f1"]

          print(json.dumps(metrics, indent=2))

          if gap < 0.20:
              sys.exit("the model does not beat the baseline by enough")
          if metrics["test_macro_f1"] < 0.85:
              sys.exit("test macro f1 is below the release threshold")
          PY

      - name: Build the image
        run: docker build -t iris-api:${{ github.sha }} .

      - name: Smoke test the image
        run: |
          docker run -d --rm --name iris -p 8000:8000 iris-api:${{ github.sha }}
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/ready && break
            sleep 1
          done
          curl -sf -X POST http://127.0.0.1:8000/predict \
            -H 'Content-Type: application/json' \
            -d '{"sepal_length_cm":5.1,"sepal_width_cm":3.5,"petal_length_cm":1.4,"petal_width_cm":0.2}'
          docker stop iris

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: model-artifacts-${{ github.sha }}
          path: labs/iris-service/artifacts/
